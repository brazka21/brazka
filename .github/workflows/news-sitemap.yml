name: Refresh news sitemap
on:
  push:
    paths:
      - news/articles.json
      - scripts/build-news-seo.py
  schedule:
    - cron: '15 * * * *'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/build-news-seo.py
      - name: Save refreshed news sitemap
        run: |
          git add news-sitemap.xml
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Refresh recent news sitemap'
            git push
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Publish refreshed sitemap
        id: deployment
        uses: actions/deploy-pages@v4
